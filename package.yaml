name:                cpp-notebook-language-server
version:             0.2.3.1

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5
- lsp-types >= 2.0.0.1
- string-interpolate
- text
- unliftio

default-extensions:
- OverloadedStrings
- QuasiQuotes
- NamedFieldPuns
- RecordWildCards
- ScopedTypeVariables
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- ViewPatterns
- MultiParamTypeClasses
- MultiWayIf
- TupleSections
- NumericUnderscores
- TypeApplications

ghc-options:
- -Wunused-packages
- -Wall
- -fno-warn-name-shadowing

library:
  source-dirs: src
  dependencies:
  - aeson
  - bytestring
  - containers
  - notebook-language-server-core
  - pcre-light
  - vector

executables:
  cpp-notebook-language-server:
    main: Main.hs
    source-dirs:
    - app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - aeson
    - bytestring
    - cpp-notebook-language-server
    - lens
    - monad-logger
    - mtl
    - notebook-language-server-core
    - optparse-applicative
    - safe
    - unix
    - unliftio-core

tests:
  cpp-notebook-language-server-test:
    main: Main.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - containers
    - cpp-notebook-language-server
    - directory
    - exceptions
    - filepath
    - lens
    - lsp-test
    - lsp-test-helpers
    - lsp-types
    - monad-logger
    - mtl
    - myers-diff
    - notebook-language-server-core
    - QuickCheck
    - quickcheck-instances
    - sandwich
    - sandwich-contexts
    - string-interpolate
    - temporary
    - text-rope
    - unliftio
    - unliftio-core
    - vector
