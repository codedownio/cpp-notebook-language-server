name: "ARC environment"
runs:
  using: "composite"
  steps:
    - name: Authenticate nix's github fetches
      shell: bash
      run: |
        # Writing to GITHUB_ENV replaces, so preserve any existing NIX_CONFIG.
        {
          echo "NIX_CONFIG<<NIX_CONFIG_EOF"
          if [[ -n "${NIX_CONFIG:-}" ]]; then echo "$NIX_CONFIG"; fi
          echo "access-tokens = github.com=${{ github.token }}"
          echo "NIX_CONFIG_EOF"
        } >> "$GITHUB_ENV"

    # Separate step: GITHUB_ENV only lands in the next one, and this eval needs the token.
    - name: Set NIX_PATH from the flake's own nixpkgs
      shell: bash
      run: |
        echo "NIX_PATH=nixpkgs=$(nix run .#nixpkgsPath)" >> "$GITHUB_ENV"
